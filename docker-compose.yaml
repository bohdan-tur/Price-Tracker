
x-runtime-env: &runtime-env
  PYTHONPATH: /app
  PYTHONUNBUFFERED: "1"
  ENVIRONMENT: ${ENVIRONMENT:-development}
  APP_DEBUG: ${APP_DEBUG:-false}

x-database-env: &database-env
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

x-rate-limit-env: &rate-limit-env
  RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/1}

x-auth-env: &auth-env
  ACCESS_TOKEN_SECRET_KEY: ${ACCESS_TOKEN_SECRET_KEY:?ACCESS_TOKEN_SECRET_KEY is required}
  REFRESH_TOKEN_SECRET_KEY: ${REFRESH_TOKEN_SECRET_KEY:?REFRESH_TOKEN_SECRET_KEY is required}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRES_MINUTES: ${ACCESS_TOKEN_EXPIRES_MINUTES:-20}
  REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-14}

x-scraper-env: &scraper-env
  SCRAPER_ALLOWED_DOMAINS: ${SCRAPER_ALLOWED_DOMAINS:?SCRAPER_ALLOWED_DOMAINS is required}
  SCRAPER_MAX_RESPONSE_BYTES: ${SCRAPER_MAX_RESPONSE_BYTES:-2097152}
  SCRAPER_MAX_URL_LENGTH: ${SCRAPER_MAX_URL_LENGTH:-2048}

x-seed-env: &seed-env
  SEED_DEFAULT_USERS: ${SEED_DEFAULT_USERS:-false}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}

x-telegram-env: &telegram-env
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-false}


x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

x-test-postgres-env: &test-postgres-env
  POSTGRES_USER: ${TEST_POSTGRES_USER:-test_user}
  POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_password_change_me}
  POSTGRES_DB: ${TEST_POSTGRES_DB:-test_price_tracker}


services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      <<: *postgres-env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  migrations:
    build: .
    command: alembic upgrade head
    environment:
      <<: [*runtime-env, *database-env, *rate-limit-env, *auth-env, *scraper-env]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  test_db:
    image: postgres:15-alpine
    profiles: ["test"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      <<: *test-postgres-env
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    container_name: price_tracker_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  api:
    build: .
    container_name: price_tracker_api
    restart: unless-stopped
    environment:
      <<: [*runtime-env, *database-env, *rate-limit-env, *auth-env, *scraper-env, *seed-env, *telegram-env]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: price_tracker_worker
    restart: unless-stopped
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info
    environment:
      <<: [*runtime-env, *database-env, *rate-limit-env, *auth-env, *scraper-env, *telegram-env]
    volumes:
      - .:/app
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: price_tracker_beat
    restart: unless-stopped
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=info
    environment:
      <<: [*runtime-env, *database-env, *rate-limit-env, *auth-env, *scraper-env]
    volumes:
      - .:/app
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

  flower:
    build: .
    container_name: price_tracker_flower
    command: celery -A app.worker.celery_app.celery_app flower --port=5555
    environment:
      <<: [*runtime-env, *database-env, *rate-limit-env, *auth-env, *scraper-env]
    ports:
      - "5555:5555"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: price_tracker_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_started
      flower:
        condition: service_started

  grafana:
    image: grafana/grafana:13.1.3
    container_name: price_tracker_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres_data:
  grafana_data:
