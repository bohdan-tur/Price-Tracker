name: CI Pipeline

on:
  push:
    branches: [main, "fix/**", "feature/**", "test/**", "chore/**", "ci/**", "refactor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ACCESS_TOKEN_SECRET_KEY: ci-only-access-secret-not-for-production-2026
      REFRESH_TOKEN_SECRET_KEY: ci-only-refresh-secret-not-for-production-2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRES_MINUTES: "20"
      REFRESH_TOKEN_EXPIRES_DAYS: "14"
      APP_DEBUG: "false"
      GRAFANA_ADMIN_PASSWORD: ci_only_grafana_password
      SEED_DEFAULT_USERS: "false"
      SCRAPER_ALLOWED_DOMAINS: '["rozetka.com.ua"]'
      SCRAPER_MAX_RESPONSE_BYTES: "2097152"
      SCRAPER_MAX_URL_LENGTH: "2048"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_postgres_password
      POSTGRES_DB: price_tracker
      DATABASE_URL: postgresql+asyncpg://postgres:ci_postgres_password@db:5432/price_tracker
      TEST_POSTGRES_USER: test_user
      TEST_POSTGRES_PASSWORD: ci_test_password
      TEST_POSTGRES_DB: test_price_tracker
      TEST_DATABASE_URL: postgresql+asyncpg://test_user:ci_test_password@test_db:5432/test_price_tracker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CI tools
        run: python -m pip install --upgrade pip ruff pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter
        run: ruff format --check .

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start infra
        run: docker compose --profile test up -d db test_db redis

      - name: Build API image
        run: docker compose build api

      - name: Run Mypy
        run: docker compose run --rm --no-deps api python -m mypy app 

      - name: Prepare coverage output
        run: mkdir -p coverage-reports && chmod 777 coverage-reports

      - name: Run Pytest
        run: >-
          docker compose --profile test run --rm
          -e ENVIRONMENT=test
          -e TEST_DATABASE_URL
          -e COVERAGE_FILE=/tmp/.coverage
          api python -m pytest tests -v
          --cov=app
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage-reports/coverage.xml
          --cov-fail-under=75

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-reports/coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-reports/coverage.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

      - name: Stop containers
        if: always()
        run: docker compose --profile test down -v
