name: CI Pipeline

on:
  push:
    branches: [main, "fix/**", "feature/**", "test/**", "chore/**", "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ACCESS_TOKEN_SECRET_KEY: ci-only-access-secret-not-for-production-2026
      REFRESH_TOKEN_SECRET_KEY: ci-only-refresh-secret-not-for-production-2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRES_MINUTES: "20"
      REFRESH_TOKEN_EXPIRES_DAYS: "14"
      DEBUG: "false"
      SEED_DEFAULT_USERS: "false"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_postgres_password
      POSTGRES_DB: price_tracker
      DATABASE_URL: postgresql+asyncpg://postgres:ci_postgres_password@db:5432/price_tracker
      TEST_POSTGRES_USER: test_user
      TEST_POSTGRES_PASSWORD: ci_test_password
      TEST_POSTGRES_DB: test_price_tracker
      TEST_DATABASE_URL: postgresql+asyncpg://test_user:ci_test_password@test_db:5432/test_price_tracker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CI tools
        run: python -m pip install --upgrade pip ruff pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter
        run: ruff format --check .

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start infra
        run: docker compose --profile test up -d db test_db redis

      - name: Build API image
        run: docker compose build api

      - name: Run Pytest
        run: >-
          docker compose --profile test run --rm
          -e ENVIRONMENT=test
          -e TEST_DATABASE_URL
          api python -m pytest tests -v

      - name: Stop containers
        if: always()
        run: docker compose --profile test down -v
